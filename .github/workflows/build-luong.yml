name: Build F.VNN desktop app

on:
  workflow_dispatch:
  push:
    branches: [claude/news-aggregator-app-0b75dd]

permissions:
  contents: write

jobs:
  # Create the release exactly once up front so the build job's
  # `--publish always` just uploads assets to a release that already
  # exists, instead of racing to create it itself.
  prepare-release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - id: version
        run: echo "version=1.0.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ steps.version.outputs.version }}" \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "F.VNN v${{ steps.version.outputs.version }}" \
            --notes "Tự động build từ commit ${{ github.sha }}"

  build-windows:
    needs: prepare-release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      - name: Build and publish (win x64)
        run: npx electron-builder --win --x64 --publish always "-c.extraMetadata.version=${{ needs.prepare-release.outputs.version }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: fvnn-windows
          path: |
            release/*.exe
            release/*.zip
            release/*.blockmap
          retention-days: 30

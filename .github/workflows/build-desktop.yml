name: Build desktop app

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run electron:dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: techwave-windows
          path: |
            release/*.exe
            release/*.blockmap
          retention-days: 30

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run electron:dist:mac
      - uses: actions/upload-artifact@v4
        with:
          name: techwave-macos
          path: |
            release/*.dmg
            release/*.zip
            release/*.blockmap
          retention-days: 30

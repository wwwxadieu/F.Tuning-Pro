name: Build desktop app

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  # electron-builder races itself when multiple targets/archs try to publish
  # concurrently (each one checks "does the release exist?" and, seeing no,
  # tries to create it — the loser gets a 422 from GitHub). Creating the
  # release exactly once up front means every later `--publish always` call
  # just uploads assets to a release that already exists.
  prepare-release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - id: version
        run: echo "version=0.1.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ steps.version.outputs.version }}" \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "${{ steps.version.outputs.version }}" \
            --notes "Tự động build từ commit ${{ github.sha }}"

  build-windows:
    needs: prepare-release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run electron:prepare
      - name: Build and publish (win x64)
        run: npx electron-builder --win --x64 --publish always "-c.extraMetadata.version=${{ needs.prepare-release.outputs.version }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: techwave-windows
          path: |
            release/*.exe
            release/*.blockmap
          retention-days: 30

  build-macos:
    needs: prepare-release
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run electron:prepare
      - name: Build and publish (mac x64)
        run: npx electron-builder --mac --x64 --publish always "-c.extraMetadata.version=${{ needs.prepare-release.outputs.version }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish (mac arm64)
        run: npx electron-builder --mac --arm64 --publish always "-c.extraMetadata.version=${{ needs.prepare-release.outputs.version }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: techwave-macos
          path: |
            release/*.dmg
            release/*.zip
            release/*.blockmap
          retention-days: 30

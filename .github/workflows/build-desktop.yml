name: Build desktop app

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Compute version
        id: version
        shell: bash
        run: echo "version=0.1.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
      - run: npm run electron:prepare
      - name: Build and publish (win x64)
        run: npx electron-builder --win --x64 --publish always "-c.extraMetadata.version=${{ steps.version.outputs.version }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: techwave-windows
          path: |
            release/*.exe
            release/*.blockmap
          retention-days: 30

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Compute version
        id: version
        shell: bash
        run: echo "version=0.1.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
      - run: npm run electron:prepare
      # Built and published as two separate sequential electron-builder
      # invocations (not one `--x64 --arm64` call): publishing both archs in a
      # single invocation races to create the same GitHub release and fails.
      - name: Build and publish (mac x64)
        run: npx electron-builder --mac --x64 --publish always "-c.extraMetadata.version=${{ steps.version.outputs.version }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish (mac arm64)
        run: npx electron-builder --mac --arm64 --publish always "-c.extraMetadata.version=${{ steps.version.outputs.version }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: techwave-macos
          path: |
            release/*.dmg
            release/*.zip
            release/*.blockmap
          retention-days: 30
